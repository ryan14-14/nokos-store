<!DOCTYPE html>
<html>
<head>
  <title>Nokos Store</title>
</head>
<body>

<h1>Jual Nokos</h1>
<div id="produk"></div>

<script>
async function load() {
  let res = await fetch('/produk');
  let data = await res.json();

  let html = "";
  data.forEach(p => {
    html += `
      <div>
        <h3>${p.nama}</h3>
        <p>Harga: Rp ${p.harga}</p>
        <p>Stok: ${p.stok}</p>
        <button onclick="order(${p.id})">Beli</button>
      </div>
      <hr>
    `;
  });

  document.getElementById("produk").innerHTML = html;
}

async function order(id) {
  let res = await fetch('/order', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id})
  });

  let data = await res.json();
  alert(data.status);
  load();
}

load();
</script>

</body>
</html>
