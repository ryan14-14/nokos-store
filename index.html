<!DOCTYPE html>
<html>
<head>
  <title>Nokos Store</title>
</head>
<body>

<h1>Jual Nokos</h1>
<div id="produk"></div>

<script>
async function load() {
  let res = await fetch('/produk');
  let data = await res.json();

  let html = "";
  data.forEach(p => {
    html += `
      <div>
        <h3>${p.nama}</h3>
        <p>Harga: Rp ${p.harga}</p>
        <p>Stok: ${p.stok}</p>
        <button onclick="order(${p.id})">Beli</button>
      </div>
      <hr>
    `;
  });

  document.getElementById("produk").innerHTML = html;
}

async function order(id) {
  let res = await fetch('/order', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id})
  });

  let data = await res.json();
  alert(data.status);
  load();
}

load();
</script>

</body>
<div id="popup" style="display:none; position:fixed; top:20%; left:30%; background:#fff; padding:20px; border:1px solid #000;">
  <h3>Scan QRIS</h3>
  <img src="qris.jpg" width="200"><br><br>
  <button onclick="konfirmasi()">Saya sudah bayar</button>
  <button onclick="tutup()">Tutup</button>
</div>
</html>
